<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Van Andrei C. Serrano</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --text: #ffffff;
      --muted: #a8a8a8;
      --line: #2a2a2a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
      line-height: 1.6;
    }
    main {
      width: 100%;
      max-width: 480px;
      padding: 60px 24px;
      text-align: center;
    }
    img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 28px;
    }
    h1 {
      margin: 0;
      font-size: 36px;
      font-weight: 600;
      line-height: 1.2;
    }
    h3 {
      margin: 8px 0 24px;
      font-size: 14px;
      font-weight: 400;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .divider {
      width: 40px;
      height: 1px;
      background: var(--muted);
      margin: 0 auto 24px;
    }
    p {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 16px;
    }
    .label {
      margin-top: 50px;
      padding-top: 40px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    h2 {
      margin: 0 0 18px;
      font-size: 24px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <main>
    <img src="my_picture.jpg" alt="My picture">
    <h1>Serrano Van Andrei C.</h1>
    <h3>IT255</h3>
    <div class="divider"></div>
    <p>ako si van</p>

    <div class="label">01 — about</div>
    <h2>About Me</h2>
    <p>I'm Van Andrei C. Serrano, a 19-year-old BSIT student at National University. I have an interest in programming, software development, and exploring new technologies, 
        with a goal of becoming a Cloud Engineer or Solutions Architect.</p>
  </main>

</body>
</html>
